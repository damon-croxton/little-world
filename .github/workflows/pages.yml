name: Deploy LittleWorld
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: http://127.0.0.1:4176/little-world/
      QA_SOFTWARE_RENDERING: '1'
      QA_OUTPUT_DIR: screenshots/smoke
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node tools/verify-build.mjs
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Start the exact built artifact
        run: |
          npm run preview > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4176/little-world/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Bounded browser acceptance using the locked Chromium version
        run: npm run test:smoke
      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littleworld-smoke-evidence
          path: |
            screenshots/smoke/
            server.log
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  live-qa:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 6
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_COMMIT: ${{ github.sha }}
      QA_SOFTWARE_RENDERING: '1'
      QA_OUTPUT_DIR: screenshots/live
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Verify exact public artifact with the same browser acceptance command
        run: npm run test:smoke
      - name: Preserve public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littleworld-live-browser-evidence
          path: screenshots/live/
          retention-days: 14
          if-no-files-found: error
